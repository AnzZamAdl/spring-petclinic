{{- if not .Values.mysql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-app
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.labels.app }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.labels.app }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.labels.app }}
        release: {{ .Release.Name }}
    spec:
      containers:
      - name: petclinic
        image: {{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}
        ports:
        - containerPort: {{ .Values.app.env.serverPort }}
        env:
        - name: SERVER_PORT
          value: "{{ .Values.app.env.serverPort }}"
        - name: MYSQL_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_DATABASE
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "com.mysql.cj.jdbc.Driver"
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "5"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "2"
        - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
          value: "20000"
        - name: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
          value: "300000"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.app.env.serverPort }}
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.app.env.serverPort }}
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
{{- end }}
